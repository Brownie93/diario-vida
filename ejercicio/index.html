<script>
/* ============================================================
   EJERCICIO · Edu HQ  (v0.4: correcciones de técnica del curl + sesión Piernas suaves)
   - Un solo archivo. Los datos se guardan en este navegador (localStorage).
   - Respaldo manual: Ajustes > Exportar / Importar (sin la clave del hub).
   - Hub: Ajustes > Ecosistema. Deja un resumen diario (ejercicio:dia) y tu peso (ejercicio:peso).
     Contrato: ecosistema/CONTRATO-HUB.md
   - Próximas versiones: leer lo que comes/juegas desde el hub, avisos con Google Calendar.
   ============================================================ */

/* ECO:BEGIN (cliente del hub; fuente única: ecosistema/eco-client.js) */
/* ============================================================
   ECO — cliente del Hub del ecosistema (JS puro, sin dependencias)
   Se PEGA DENTRO de cada app (Diario, Cocina, Ejercicio, Bitácora), porque cada una es un archivo único.
   Contrato de datos: ecosistema/CONTRATO-HUB.md   ·   Backend: ecosistema/hub-apps-script/Code.gs

   Uso:
     Eco.configurar({ url: 'https://script.google.com/macros/s/.../exec', key: 'LA_CLAVE', device: 'ejercicio-ab12' });
     await Eco.ping();
     await Eco.enviar([ Eco.registro('ejercicio', 'dia', '2026-11-23', { minimo: true }) ]);
     const r = await Eco.traer(0, { apps: ['diario'], fromDate: '2026-11-16' });   // r.items, r.cursor
   La CLAVE se guarda solo en el dispositivo (localStorage de la app); nunca en el código ni en respaldos.
   ============================================================ */
(function (root) {
  const cfg = { url: '', key: '', device: '' };
  const LOTE = 100;

  function configurar(c) { Object.assign(cfg, c || {}); }
  function listo() { return !!(cfg.url && cfg.key); }

  function llamar(action, extra) {
    if (!listo()) return Promise.reject(new Error('sin_configurar'));
    const body = JSON.stringify(Object.assign({ action: action, key: cfg.key, device: cfg.device }, extra || {}));
    // text/plain evita la petición previa (preflight) de CORS, que Apps Script no responde.
    return fetch(cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body })
      .then(function (r) { if (!r.ok) throw new Error('http_' + r.status); return r.json(); })
      .then(function (j) { if (!j || !j.ok) throw new Error((j && j.error) || 'error'); return j; });
  }

  /** Arma un registro. id por defecto: app:tipo:fecha. opc: { id, t, del }. */
  function registro(app, tipo, fecha, datos, opc) {
    opc = opc || {};
    return {
      id: opc.id || (app + ':' + tipo + ':' + fecha),
      app: app, tipo: tipo, fecha: fecha,
      datos: datos === undefined ? null : datos,
      t: opc.t || Date.now(),
      del: !!opc.del
    };
  }

  function ping() { return llamar('ping'); }

  /** Envía registros en lotes. Devuelve { items, rejected } con todo lo que respondió el hub. */
  function enviar(items) {
    const lotes = [];
    for (let i = 0; i < items.length; i += LOTE) lotes.push(items.slice(i, i + LOTE));
    const acum = { items: [], rejected: [] };
    return lotes.reduce(function (p, lote) {
      return p.then(function () {
        return llamar('push', { items: lote }).then(function (r) {
          acum.items = acum.items.concat(r.items || []);
          acum.rejected = acum.rejected.concat(r.rejected || []);
        });
      });
    }, Promise.resolve()).then(function () { return acum; });
  }

  /** Descarga todo lo nuevo desde "since" (cursor del servidor). filtros: { apps: [...], fromDate: 'AAAA-MM-DD' }. */
  function traer(since, filtros) {
    const acum = { items: [], cursor: since || 0 };
    function paso(cursor) {
      return llamar('pull', Object.assign({ since: cursor }, filtros || {})).then(function (r) {
        acum.items = acum.items.concat(r.items || []);
        acum.cursor = r.cursor;
        return r.more ? paso(r.cursor) : acum;
      });
    }
    return paso(since || 0);
  }

  /** Texto amable para mostrar en pantalla. */
  function mensajeError(err) {
    const m = String((err && err.message) || err || '');
    if (m === 'clave') return 'La clave no coincide con la del hub.';
    if (m === 'sin_configurar') return 'Falta la URL o la clave del hub (Ajustes > Ecosistema).';
    if (/^http_/.test(m)) return 'El hub respondió con error (' + m.replace('http_', '') + '). Revisa la URL.';
    if (/fetch|network|Load failed/i.test(m)) return 'Sin conexión o URL incorrecta. Se reintentará solo.';
    return 'Error del hub: ' + m;
  }

  root.Eco = { configurar: configurar, listo: listo, registro: registro, ping: ping, enviar: enviar, traer: traer, mensajeError: mensajeError };
})(typeof window !== 'undefined' ? window : globalThis);
/* ECO:END */

function fmt(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function parse(iso) { const p = iso.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function hoy() { return fmt(new Date()); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function nuevoEstado() {
  const h = hoy();
  return { v: 1, inicio: h, tema: 'noche', log: {}, pesos: [],
    perfil: { altura: null, edad: null, metaKg: null, barraKg: null, mancKg: null }, videos: {}, notas: {}, eco: ecoDefault() };
}
function cargar() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.v === 1 && s.log) {
      const st = Object.assign(nuevoEstado(), s);
      st.eco = Object.assign(ecoDefault(), s.eco || {});
      return st;
    }
  } catch (e) {}
  return nuevoEstado();
}
let state = cargar();
const ui = { tab: 'hoy', openEx: null, embed: {} };
function guardar() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

/* ---------- Ecosistema (hub) ----------
   Esta app deja en el hub un resumen de cada día (ejercicio:dia) y tu peso (ejercicio:peso).
   Los cambios se marcan como "sucios" y se envían solos (con reintento si no hay internet). */
const ecoGen = {};
let ecoTimer = null, ecoBusy = false;
function ecoDefault() {
  return { url: '', key: '', device: 'ejercicio-' + Math.random().toString(36).slice(2, 6), sucias: [], sucP: [], ultimo: null, msg: '' };
}
function ecoConfig() { Eco.configurar({ url: state.eco.url, key: state.eco.key, device: state.eco.device }); }
function ecoMarcarDia(f) { if (state.eco.sucias.indexOf(f) < 0) state.eco.sucias.push(f); ecoGen[f] = (ecoGen[f] || 0) + 1; }
function ecoMarcarPeso(f) { if (state.eco.sucP.indexOf(f) < 0) state.eco.sucP.push(f); ecoGen['p:' + f] = (ecoGen['p:' + f] || 0) + 1; }
function ecoProgramar() { clearTimeout(ecoTimer); ecoTimer = setTimeout(function () { ecoFlush(false); }, 1200); }
function ecoResumenDia(f) {
  const e = getE(f);
  return { minimo: !!e.minimo, sesion: !!e.sesion, sesionTipo: tipoDe(f), series: setsHechos(e), xp: dayXP(f) };
}
async function ecoFlush(manual) {
  const e = state.eco;
  if (!Eco.listo()) { if (manual) e.msg = Eco.mensajeError(new Error('sin_configurar')); return; }
  if (ecoBusy) return;
  const dias = e.sucias.slice(), pesos = e.sucP.slice();
  if (!dias.length && !pesos.length) { if (manual) e.msg = ''; return; }
  ecoBusy = true;
  const snap = {};
  dias.forEach(function (f) { snap[f] = ecoGen[f] || 0; });
  pesos.forEach(function (f) { snap['p:' + f] = ecoGen['p:' + f] || 0; });
  try {
    const items = dias.map(function (f) { return Eco.registro('ejercicio', 'dia', f, ecoResumenDia(f)); });
    pesos.forEach(function (f) {
      const p = state.pesos.filter(function (x) { return x.fecha === f; })[0];
      items.push(Eco.registro('ejercicio', 'peso', f, p ? { kg: p.kg } : null, { del: !p }));
    });
    const r = await Eco.enviar(items);
    if (r.rejected.length) throw new Error('rechazado: ' + r.rejected[0].motivo);
    // solo se limpia lo que no cambió mientras se enviaba
    e.sucias = e.sucias.filter(function (f) { return !(dias.indexOf(f) >= 0 && (ecoGen[f] || 0) === snap[f]); });
    e.sucP = e.sucP.filter(function (f) { return !(pesos.indexOf(f) >= 0 && (ecoGen['p:' + f] || 0) === snap['p:' + f]); });
    e.ultimo = Date.now(); e.msg = '';
  } catch (err) { e.msg = Eco.mensajeError(err); }
  ecoBusy = false; guardar();
  if (!e.msg && (e.sucias.length || e.sucP.length)) ecoProgramar();
}
function ecoEstado() {
  const e = state.eco;
  if (!Eco.listo()) return 'Sin configurar: pega la URL y la clave del hub.';
  const pend = e.sucias.length + e.sucP.length;
  let s = e.ultimo ? 'Último envío: ' + new Date(e.ultimo).toLocaleString('es-CL', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + '.' : 'Aún no se ha enviado nada.';
  if (pend) s += ' Pendientes de enviar: ' + pend + '.';
  if (e.msg) s += ' ⚠️ ' + e.msg;
  return s;
}
function getE(iso) { return state.log[iso] || { minimo: false, sesion: false, tipo: null, sets: {} }; }
function ens(iso) {
  if (!state.log[iso]) state.log[iso] = { minimo: false, sesion: false, tipo: null, sets: {} };
  if (!state.log[iso].sets) state.log[iso].sets = {};
  return state.log[iso];
}

/* ---------- Cálculos ---------- */
function tipoDe(iso) { const e = state.log[iso]; return (e && e.tipo) || RUTINA[parse(iso).getDay()]; }
function setsHechos(e) {
  let n = 0;
  Object.keys(e.sets || {}).forEach(function (k) { (e.sets[k] || []).forEach(function (s) { if (s && s.done) n++; }); });
  return n;
}
function hecho(e) { return !!(e && (e.minimo || e.sesion || setsHechos(e) > 0)); }
function dayXP(iso) {
  const e = state.log[iso]; if (!e) return 0;
  let x = 0;
  if (e.sesion) x += SESIONES[tipoDe(iso)].xp; else if (e.minimo) x += 10;
  return x + setsHechos(e) * 2;
}
function totalXP() { return Object.keys(state.log).reduce(function (a, k) { return a + dayXP(k); }, 0); }
function nivelInfo(xp) {
  let l = 1; while (30 * (l + 1) * l <= xp) l++;
  const base = 30 * l * (l - 1), next = 30 * (l + 1) * l;
  return { l: l, base: base, next: next, pct: Math.round((xp - base) / (next - base) * 100) };
}
function racha() {
  let n = 0; const d = new Date();
  for (let i = 0; i < 400; i++) {
    const iso = fmt(d);
    if (hecho(state.log[iso])) n++;
    else if (RUTINA[d.getDay()] === 'descanso') { /* el descanso no rompe la racha */ }
    else if (i === 0) { /* hoy aún está pendiente */ }
    else break;
    d.setDate(d.getDate() - 1);
  }
  return n;
}
function semana() {
  const diff = Math.round((parse(hoy()) - parse(state.inicio)) / 86400000);
  return Math.max(1, Math.floor(diff / 7) + 1);
}
function ultimoKg(id) {
  const ks = Object.keys(state.log).sort().reverse();
  for (let j = 0; j < ks.length; j++) {
    const a = (state.log[ks[j]].sets || {})[id];
    if (a) for (let i = a.length - 1; i >= 0; i--) { if (a[i] && a[i].kg !== '' && a[i].kg != null) return a[i].kg; }
  }
  return '';
}
function ytId(u) {
  if (!u) return null;
  const m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
function pesosOrdenados() { return state.pesos.slice().sort(function (a, b) { return a.fecha < b.fecha ? -1 : 1; }); }

/* ---------- Vistas ---------- */
function vHoy() {
  const iso = hoy(), en = getE(iso), tipo = tipoDe(iso), S = SESIONES[tipo];
  const xp = totalXP(), ni = nivelInfo(xp), r = racha(), sem = semana();
  const fecha = new Date().toLocaleDateString('es-CL', { weekday: 'long', day: 'numeric', month: 'long' });
  const titulo = TITULOS[Math.min(ni.l - 1, TITULOS.length - 1)];

  // meta de peso
  let meta = '';
  const ps = pesosOrdenados(), ult = ps.length ? ps[ps.length - 1].kg : null, mk = state.perfil.metaKg;
  if (mk && ult) {
    const falta = ult - mk;
    meta = falta > 0.05 ? '<div class="small">⚖️ Te faltan <b>' + falta.toFixed(1) + ' kg</b> para tu meta (' + mk + ' kg).</div>'
                       : '<div class="small">⚖️ ¡Llegaste a tu meta de ' + mk + ' kg!</div>';
  } else {
    meta = '<div class="small mut">⚖️ Define tu meta de peso en Progreso para ver cuánto falta.</div>';
  }

  // últimos 7 días
  let dots = '';
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = fmt(d), h = hecho(state.log[k]), rest = RUTINA[d.getDay()] === 'descanso';
    dots += '<div class="' + (h ? 'ok ' : '') + (i === 0 ? 'today' : '') + '">' + DIAS[d.getDay()].slice(0, 3) +
            '<b>' + (h ? '●' : (rest ? '–' : '○')) + '</b></div>';
  }

  // mensaje sin culpa
  let msg = '';
  const ay = new Date(); ay.setDate(ay.getDate() - 1);
  if (!hecho(state.log[fmt(ay)]) && RUTINA[ay.getDay()] !== 'descanso' && !hecho(en) && Object.keys(state.log).length) {
    msg = '<div class="note">Ayer no quedó registro y está bien. Hoy el mínimo de 5 minutos ya te devuelve al ritmo.</div>';
  }

  const opts = Object.keys(SESIONES).map(function (k) {
    return '<option value="' + k + '"' + (k === tipo ? ' selected' : '') + '>' + SESIONES[k].icon + ' ' + SESIONES[k].titulo + '</option>';
  }).join('');

  let sets = '';
  if (S.ej && S.ej.length) {
    sets = S.ej.map(function (it) {
      const id = it[0], ser = it[1], reps = it[2], e = EJ[id];
      const n = sem === 1 ? Math.min(2, ser) : ser;
      const last = e.sinPeso ? '' : (ultimoKg(id) || (e.mancuerna ? state.perfil.mancKg : state.perfil.barraKg) || '');
      let rows = '';
      for (let i = 0; i < n; i++) {
        const s = (en.sets[id] || [])[i] || {};
        const kg = (s.kg !== undefined && s.kg !== '' && s.kg !== null) ? s.kg : last;
        rows += '<div class="set" data-ex="' + id + '" data-i="' + i + '"><span class="n">' + (i + 1) + '</span>' +
          '<input type="number" inputmode="numeric" min="0" placeholder="' + (e.sinPeso && id === 'plancha' ? 'segundos' : 'reps') + '" value="' + esc(s.reps) + '" data-f="reps">' +
          '<input type="number" inputmode="decimal" step="0.5" min="0" placeholder="' + (e.mancuerna ? 'kg mancuerna' : 'kg total') + '" value="' + esc(kg) + '" data-f="kg"' + (e.sinPeso ? ' style="visibility:hidden" tabindex="-1" aria-hidden="true"' : '') + '>' +
          '<button class="chk' + (s.done ? ' on' : '') + '" data-act="toggleSet" aria-label="Serie ' + (i + 1) + ' hecha">' + (s.done ? '✓' : '') + '</button></div>';
      }
      return '<div class="ex"><div class="row"><b>' + e.nombre + '</b><button class="link" data-act="verEx" data-ex="' + id + '">ver cómo</button></div>' +
             '<div class="mut small">' + n + ' series de ' + reps + (e.sinPeso ? ' · sin peso, controla la técnica' : ' · termina dejando ~2 repeticiones de sobra') + '</div>' + rows + '</div>';
    }).join('');
  }

  const puedeTerminar = tipo !== 'descanso' && tipo !== 'minimo';
  return '<div class="card hero"><div class="row"><div><div class="mut small">' + esc(fecha) + '</div><h1>Nivel ' + ni.l + ' · ' + titulo + '</h1></div>' +
    '<div class="racha">🔥 ' + r + (r === 1 ? ' día' : ' días') + '</div></div>' +
    '<div class="bar"><i style="width:' + ni.pct + '%"></i></div>' +
    '<div class="mut small">' + (xp - ni.base) + ' / ' + (ni.next - ni.base) + ' XP para el nivel ' + (ni.l + 1) + ' · Semana ' + sem + '</div>' + meta + '</div>' +
    '<div class="card"><div class="week">' + dots + '</div></div>' + msg +
    '<div class="card"><div class="row"><h2>' + S.icon + ' ' + S.titulo + '</h2></div><p class="mut">' + S.desc + '</p>' +
    (sem === 1 && S.ej && S.ej.length ? '<div class="note">Semana 1: 2 series por ejercicio y barra sola o carga muy liviana. La idea es aprender el movimiento.</div>' : '') +
    '<label>Cambiar la sesión de hoy</label><select data-f="tipoHoy">' + opts + '</select>' +
    '<button class="btn ' + (en.minimo ? 'on' : 'pri') + '" data-act="minimo">' + (en.minimo ? '✅ Mínimo hecho (5 min)' : '🌱 Hice mi mínimo (5 min)') + '</button>' +
    sets +
    (puedeTerminar ? '<button class="btn ' + (en.sesion ? 'on' : '') + '" data-act="terminar">' + (en.sesion ? '✅ Sesión completa (toca para deshacer)' : 'Marcar sesión completa') + '</button>' : '') +
    '<p class="mut small">Hoy suma <b>' + dayXP(hoy()) + ' XP</b>. ' +
    (puedeTerminar ? 'Cada serie marcada da 2 XP; el mínimo, 10; una sesión completa, ' + S.xp + '.' : 'El mínimo da 10 XP y mantiene tu racha.') + '</p></div>';
}

  const filas = orden.map(function (d) {
    const S = SESIONES[RUTINA[d]];

  const bloque = function (k) {

    '</ul></div>' +
    '<div class="card"><h2>Reglas del juego</h2><ul>' +

}

function grafico() {
  const p = pesosOrdenados();
  if (p.length < 2) return '<p class="mut small">Registra otro peso para ver tu línea de progreso.</p>';
  const W = 320, H = 140, pd = 26, mk = state.perfil.metaKg;
  const ks = p.map(function (x) { return x.kg; });
  let mn = Math.min.apply(null, ks), mx = Math.max.apply(null, ks);
  if (mk) { mn = Math.min(mn, mk); mx = Math.max(mx, mk); }
  if (mx - mn < 1) { mx += 0.5; mn -= 0.5; }
  const t0 = parse(p[0].fecha).getTime(), t1 = parse(p[p.length - 1].fecha).getTime(), dt = Math.max(1, t1 - t0);
  const X = function (f) { return pd + (parse(f).getTime() - t0) / dt * (W - 2 * pd); };
  const Y = function (k) { return H - pd - (k - mn) / (mx - mn) * (H - 2 * pd); };
  const pts = p.map(function (x) { return X(x.fecha).toFixed(1) + ',' + Y(x.kg).toFixed(1); }).join(' ');
  const dots = p.map(function (x) { return '<circle cx="' + X(x.fecha).toFixed(1) + '" cy="' + Y(x.kg).toFixed(1) + '" r="3.5" fill="var(--ac2)"/>'; }).join('');
  const meta = mk ? '<line x1="' + pd + '" x2="' + (W - pd) + '" y1="' + Y(mk).toFixed(1) + '" y2="' + Y(mk).toFixed(1) + '" stroke="var(--warn)" stroke-dasharray="4 4"/>' +
    '<text x="' + (W - pd) + '" y="' + (Y(mk) - 4).toFixed(1) + '" text-anchor="end" font-size="10" fill="var(--warn)">meta ' + mk + ' kg</text>' : '';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Gráfico de peso">' +
    '<text x="4" y="' + (pd + 3) + '" font-size="10" fill="var(--mut)">' + mx.toFixed(1) + '</text>' +
    '<text x="4" y="' + (H - pd + 3) + '" font-size="10" fill="var(--mut)">' + mn.toFixed(1) + '</text>' +
    meta + '<polyline points="' + pts + '" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round"/>' + dots + '</svg>';
}

function vProgreso() {
  const ps = pesosOrdenados(), xp = totalXP();
  const dias = Object.keys(state.log).filter(function (k) { return hecho(state.log[k]); }).length;

  }
  const hist = ps.slice().reverse().slice(0, 10).map(function (x) {

  }).join('');
  return '<div class="card"><h2>Peso</h2>' + resumen + grafico() +
    '<div class="two"><div><label>Fecha</label><input type="date" id="pesoFecha" value="' + hoy() + '"></div>' +
    '<div><label>Peso (kg)</label><input type="number" inputmode="decimal" step="0.1" id="pesoKg" placeholder="ej. 98.5"></div></div>' +
    '<button class="btn pri" data-act="addPeso">Guardar peso</button>' +
    '<p class="mut small">Con pesarte una vez por semana alcanza: el peso sube y baja de un día a otro y puede desanimar.</p>' + hist + '</div>' +
    '<div class="card"><h2>Meta de peso</h2><label>Mi meta (kg)</label><input type="number" inputmode="decimal" step="0.5" data-f="perfil" data-k="metaKg" value="' + esc(state.perfil.metaKg) + '" placeholder="Aún sin definir">' +
    '<p class="mut small">La pantalla de Hoy te mostrará cuánto falta. Puedes elegir una meta intermedia más cercana, que motiva más.</p></div>' +
    '<div class="card"><h2>Tu aventura</h2><div class="two"><div><div class="mut small">XP total</div><b>' + xp + '</b></div><div><div class="mut small">Nivel</div><b>' + nivelInfo(xp).l + '</b></div>' +
    '<div><div class="mut small">Días con actividad</div><b>' + dias + '</b></div><div><div class="mut small">Sesiones completas</div><b>' + ses + '</b></div></div></div>';
}

function vAjustes() {
  return '<div class="card"><h2>Apariencia</h2><button class="btn" data-act="tema">' + (state.tema === 'noche' ? '☀️ Cambiar a modo día' : '🌙 Cambiar a modo noche') + '</button></div>' +
    '<div class="card"><h2>Mis datos</h2><div class="two"><div><label>Altura (cm)</label><input type="number" inputmode="numeric" data-f="perfil" data-k="altura" value="' + esc(state.perfil.altura) + '"></div>' +
    '<div><label>Edad</label><input type="number" inputmode="numeric" data-f="perfil" data-k="edad" value="' + esc(state.perfil.edad) + '"></div></div>' +
    '<label>Peso de la barra sola (kg)</label><input type="number" inputmode="decimal" step="0.5" data-f="perfil" data-k="barraKg" value="' + esc(state.perfil.barraKg) + '" placeholder="Sin medir aún">' +
    '<p class="mut small">Para medirla: pésate solo, luego pésate sujetando la barra, y resta. Después, en cada serie anota el peso total (barra + discos).</p>' +
    '<label>Peso de tu mancuerna de remo (kg, una)</label><input type="number" inputmode="decimal" step="0.5" data-f="perfil" data-k="mancKg" value="' + esc(state.perfil.mancKg) + '" placeholder="Sin medir aún">' +
    '<p class="mut small">Pésala en una pesa de baño (o pésate con y sin ella). Con eso la app te sugiere el peso en el remo.</p></div>' +
    '<div class="card"><h2>Ecosistema</h2><p class="mut small">Conecta esta app con tu hub para que el Diario y las demás apps vean tu ejercicio y tu peso. Pega la URL y la clave que te dio el script del hub.</p>' +
    '<label>URL del hub</label><input type="text" data-f="eco" data-k="url" value="' + esc(state.eco.url) + '" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">' +
    '<label>Clave</label><input type="password" data-f="eco" data-k="key" value="' + esc(state.eco.key) + '" autocomplete="off">' +
    '<button class="btn" data-act="ecoPing">Probar conexión</button>' +
    '<button class="btn" data-act="ecoSync">Enviar todo ahora</button>' +
    '<p class="small">' + esc(ui.ecoMsg || '') + '</p>' +
    '<p class="mut small">' + esc(ecoEstado()) + '</p>' +
    '<p class="mut small">La clave se guarda solo en este dispositivo y no va en los respaldos.</p></div>' +
    '<div class="card"><h2>Respaldo</h2><p class="mut small">Tus datos viven en este navegador. Exporta un respaldo de vez en cuando, o para pasarlos a otro dispositivo.</p>' +
    '<button class="btn" data-act="exportar">⬇️ Exportar respaldo</button>' +
    '<label>Importar respaldo (.json)</label><input type="file" accept="application/json,.json" id="imp">' +
    '<button class="btn danger" data-act="reset">Borrar todos los datos</button></div>' +
    '<div class="card"><h2>Próximamente</h2><ul class="mut small"><li>Leer del hub lo que comes y juegas, para ajustar la dieta y la carga</li><li>Misión «ejercicio» dentro del Diario</li><li>Avisos con Google Calendar</li><li>Rutinas y ajustes asistidos por IA</li></ul></div>';
}

const TABS = [['hoy', '🏠', 'Hoy', vHoy], ['rutina', '🗓', 'Rutina', vRutina], ['ejercicios', '📖', 'Ejercicios', vEjercicios], ['progreso', '📈', 'Progreso', vProgreso], ['ajustes', '⚙️', 'Ajustes', vAjustes]];

function render() {
  document.documentElement.dataset.theme = state.tema;
  const t = TABS.filter(function (x) { return x[0] === ui.tab; })[0] || TABS[0];
  document.getElementById('app').innerHTML = t[3]();
  document.getElementById('nav').innerHTML = TABS.map(function (x) {
    return '<button class="' + (x[0] === ui.tab ? 'on' : '') + '" data-act="tab" data-tab="' + x[0] + '"><span>' + x[1] + '</span>' + x[2] + '</button>';
  }).join('');
}

/* ---------- Eventos ---------- */
document.addEventListener('click', function (e) {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (a === 'tab') { ui.tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
  if (a === 'minimo') { const en = ens(hoy()); en.minimo = !en.minimo; ecoMarcarDia(hoy()); guardar(); render(); ecoProgramar(); return; }
  if (a === 'terminar') { const en = ens(hoy()); en.sesion = !en.sesion; ecoMarcarDia(hoy()); guardar(); render(); ecoProgramar(); return; }
  if (a === 'toggleSet') {
    const row = t.closest('.set'), ex = row.dataset.ex, i = +row.dataset.i, en = ens(hoy());
    en.sets[ex] = en.sets[ex] || [];
    const cur = en.sets[ex][i] || {};
    en.sets[ex][i] = { reps: row.querySelector('[data-f=reps]').value, kg: row.querySelector('[data-f=kg]').value, done: !cur.done };
    ecoMarcarDia(hoy()); guardar(); render(); ecoProgramar(); return;
  }
  if (a === 'verEx') { ui.tab = 'ejercicios'; ui.openEx = t.dataset.ex; render(); window.scrollTo(0, 0); return; }
  if (a === 'abrirEx') { ui.openEx = ui.openEx === t.dataset.ex ? null : t.dataset.ex; render(); return; }
  if (a === 'embed') { ui.embed[t.dataset.ex] = !ui.embed[t.dataset.ex]; render(); return; }
  if (a === 'addPeso') {
    const kg = parseFloat(document.getElementById('pesoKg').value), f = document.getElementById('pesoFecha').value || hoy();
    if (!(kg >= 30 && kg <= 300)) { alert('Escribe un peso entre 30 y 300 kg.'); return; }
    state.pesos = state.pesos.filter(function (p) { return p.fecha !== f; });
    state.pesos.push({ fecha: f, kg: Math.round(kg * 10) / 10 });
    ecoMarcarPeso(f); guardar(); render(); ecoProgramar(); return;
  }
  if (a === 'delPeso') {
    const p = state.pesos[+t.dataset.i];
    state.pesos.splice(+t.dataset.i, 1);
    if (p) ecoMarcarPeso(p.fecha);
    guardar(); render(); ecoProgramar(); return;
  }
  if (a === 'tema') { state.tema = state.tema === 'noche' ? 'dia' : 'noche'; guardar(); render(); return; }
  if (a === 'ecoPing') {
    ui.ecoMsg = 'Probando…'; render();
    Eco.ping().then(function (r) { ui.ecoMsg = '✅ Conectado al hub (' + r.registros + ' registros guardados).'; })
      .catch(function (err) { ui.ecoMsg = '⚠️ ' + Eco.mensajeError(err); })
      .then(function () { if (ui.tab === 'ajustes') render(); });
    return;
  }
  if (a === 'ecoSync') {
    Object.keys(state.log).forEach(ecoMarcarDia);
    state.pesos.forEach(function (p) { ecoMarcarPeso(p.fecha); });
    guardar(); ui.ecoMsg = 'Enviando…'; render();
    ecoFlush(true).then(function () { ui.ecoMsg = state.eco.msg ? '' : '✅ Todo enviado.'; if (ui.tab === 'ajustes') render(); });
    return;
  }
  if (a === 'exportar') {
    const copia = JSON.parse(JSON.stringify(state));
    copia.eco = Object.assign({}, copia.eco, { key: '' });          // la clave del hub NUNCA va en un respaldo
    const blob = new Blob([JSON.stringify(copia, null, 2)], { type: 'application/json' });
    const l = document.createElement('a');
    l.href = URL.createObjectURL(blob); l.download = 'ejercicio-respaldo-' + hoy() + '.json';
    document.body.appendChild(l); l.click(); l.remove(); return;
  }
  if (a === 'reset') {
    if (confirm('¿Borrar todos los datos de esta app? No se puede deshacer.')) {
      const eco = state.eco;                                         // se conserva la conexión con el hub
      state = nuevoEstado(); state.eco = Object.assign(ecoDefault(), { url: eco.url, key: eco.key, device: eco.device });
      guardar(); render();
    }
    return;
  }
});

document.addEventListener('change', function (e) {
  const t = e.target;
  if (t.id === 'imp') {
    const f = t.files && t.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = function () {
      try {
        const s = JSON.parse(rd.result);
        if (!s || s.v !== 1 || !s.log) throw new Error('formato');
        const eco = state.eco;                                       // el respaldo no trae la clave: se conserva la actual
        state = Object.assign(nuevoEstado(), s); state.eco = eco;
        Object.keys(state.log).forEach(ecoMarcarDia); state.pesos.forEach(function (p) { ecoMarcarPeso(p.fecha); });
        guardar(); render(); ecoProgramar(); alert('Respaldo importado.');
      } catch (err) { alert('Ese archivo no parece un respaldo de esta app.'); }
    };
    rd.readAsText(f); return;
  }
  const f = t.dataset && t.dataset.f; if (!f) return;
  if (f === 'tipoHoy') {
    const en = ens(hoy()); const d = RUTINA[new Date().getDay()];
    en.tipo = t.value === d ? null : t.value; en.sesion = false; ecoMarcarDia(hoy()); guardar(); render(); ecoProgramar(); return;
  }
  if (f === 'eco') {
    state.eco[t.dataset.k] = t.value.trim(); ecoConfig(); guardar(); ui.ecoMsg = ''; render();
    if (Eco.listo()) ecoProgramar();
    return;
  }
  if (f === 'reps' || f === 'kg') {
    const row = t.closest('.set'); if (!row) return;
    const ex = row.dataset.ex, i = +row.dataset.i, en = ens(hoy());
    en.sets[ex] = en.sets[ex] || [];
    const cur = en.sets[ex][i] || { reps: '', kg: '', done: false };
    cur[f] = t.value; en.sets[ex][i] = cur; guardar(); return;
  }
  if (f === 'perfil') {
    const v = t.value === '' ? null : parseFloat(t.value);
    state.perfil[t.dataset.k] = (v === null || isNaN(v)) ? null : v; guardar(); render(); return;
  }
  if (f === 'video') { state.videos[t.dataset.ex] = t.value.trim(); guardar(); render(); return; }
  if (f === 'nota') { state.notas[t.dataset.ex] = t.value; guardar(); return; }
});

ecoConfig();
window.addEventListener('online', ecoProgramar);
render();
if (Eco.listo() && (state.eco.sucias.length || state.eco.sucP.length)) ecoProgramar();   // reenvía lo que quedó pendiente
</script>
</body>
</html>
